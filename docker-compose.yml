services:
  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/pi-coding-agent:latest
    container_name: pi_coding_agent
    
    tty: true
    stdin_open: true

    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - PARANOID_MODE=${PARANOID_MODE:-true}
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=user.signingkey
      - GIT_CONFIG_VALUE_0=${GIT_GPG_KEY}
      - GIT_CONFIG_KEY_1=commit.gpgsign
      - GIT_CONFIG_VALUE_1=${GIT_GPG_SIGN:-false}

    secrets:
      - source: github_token
        target: ${SECRET_TARGET_PATH:-/run/secrets/gh_default}

    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /workspace
      - pi_data:/home/node/.pi
      - claude_data:/home/node/.claude
      - ./.claude-data/.claude.json:/home/node/.claude.json

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    read_only: true

    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node/.config:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.npm:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.cache:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.pi-lens:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid

    pids_limit: 150

    networks:
      - pi_network

    restart: "no"

volumes:
  pi_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.pi-data

  claude_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/.claude-data

networks:
  pi_network:
    driver: bridge

secrets:
  github_token:
    file: ${PWD}/.secrets/github_token.txt
services:
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./src/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - pi_network
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - SEARXNG_SECRET_KEY

  credential-proxy:
    build:
      context: .
      dockerfile: src/credential-proxy/Dockerfile
    image: local/pi-credential-proxy:latest
    environment:
      # Real API keys live here only — never forwarded to the agent container
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - GITHUB_TOKEN
    networks:
      - pi_network
    read_only: true
    restart: "no"

  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/pi-coding-agent:latest
    tty: true
    stdin_open: true
    depends_on:
      - credential-proxy
      - searxng

    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - PARANOID_MODE=${PARANOID_MODE:-true}
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=user.signingkey
      - GIT_CONFIG_VALUE_0=${GIT_GPG_KEY}
      - GIT_CONFIG_KEY_1=commit.gpgsign
      - GIT_CONFIG_VALUE_1=${GIT_GPG_SIGN:-false}
      # LLM inference is routed through credential-proxy; real keys never reach this container
      - ANTHROPIC_API_KEY=proxy
      - OPENAI_API_KEY=proxy
      - OPENROUTER_API_KEY=proxy
      # GitHub REST API routed through credential-proxy; git ops use the gh-vault secret mechanism
      - GITHUB_API_URL=http://credential-proxy:8080/github
      # SearXNG web search — no API key needed for a local instance
      - SEARXNG_URL=http://searxng:8080

    secrets:
      - source: github_token
        target: ${SECRET_TARGET_PATH:-/run/secrets/gh_default}

    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-./workspace}
        target: /workspace
      - pi_data:/home/node/.pi
      - claude_data:/home/node/.claude
      - ${CLAUDE_DATA_DIR:-${PWD}/.claude-data}/.claude.json:/home/node/.claude.json

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    read_only: true

    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node/.config:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.npm:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.cache:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.pi-lens:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid

    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-4g}
          cpus: "${CPUS:-4.0}"
          pids: 150

    networks:
      - pi_network

    restart: "no"

volumes:
  pi_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PI_DATA_DIR:-${PWD}/.pi-data}

  claude_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAUDE_DATA_DIR:-${PWD}/.claude-data}

networks:
  pi_network:
    driver: bridge

secrets:
  github_token:
    file: ${PWD}/.secrets/github_token.txt